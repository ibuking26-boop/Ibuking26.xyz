<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earning + Viral Tools - 10 Pro - World VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Inter',system-ui;margin:0;padding:0}
body{background:#f6f7fb;color:#111}
header{background:#0a0a0a;color:#fff;padding:22px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-weight:900;font-size:20px;letter-spacing:0.5px} header h1 span{background:linear-gradient(90deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.wrap{max-width:1200px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px}
.card{background:#fff;border-radius:18px;padding:18px 10px;text-align:center;border:1px solid #eee;cursor:pointer;transition:0.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,.1);border-color:#f59e0b}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:99;padding:10px;overflow:auto}
.modal.show{display:flex;justify-content:center;align-items:flex-start}
.box{background:#fff;width:100%;max-width:540px;border-radius:22px;padding:20px;margin:20px auto}
.box h2{font-size:21px;font-weight:900}
label{font-size:10.5px;font-weight:800;margin-top:13px;display:block;text-transform:uppercase;color:#374151}
input,select{width:100%;padding:11px 10px;border:1.5px solid #e5e7eb;border-radius:10px;margin-top:5px;font-size:13.5px;font-weight:600;outline:none}
.btn{width:100%;padding:13px;background:linear-gradient(90deg,#f59e0b,#ef4444);color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:16px;cursor:pointer}
.res{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:14px;padding:14px;margin-top:14px;display:none;line-height:2;font-size:13px;word-break:break-all}
.res.show{display:block}
.x{float:right;font-size:26px;cursor:pointer}
.big{font-size:19px;color:#d97706;font-weight:900;line-height:1.3}
.tag{font-size:9px;font-weight:800;padding:3px 8px;border-radius:20px;display:inline-block;margin-top:6px;letter-spacing:0.5px}
.tag-earn{background:#fef3c7;color:#92400e} .tag-viral{background:#dbeafe;color:#1e40af}
</style>
</head>
<body>
<header><h1>FOLDER 2: <span>EARNING + VIRAL - 10 PRO WORLD</span></h1></header>
<div class="wrap"><div class="grid" id="grid"></div></div>
<div class="modal" id="modal" onclick="if(event.target==this)closeM()"><div class="box"><span class="x" onclick="closeM()">×</span><h2 id="mtitle"></h2><div id="minputs"></div><button class="btn" onclick="calc()">CALCULATE</button><div class="res" id="mres"></div></div></div>
<script>
const names=["Loan Comparison Pro","Credit Score Pro","Insurance Premium Pro","Crypto Profit Pro","Stock Return Pro","Tip Calculator Pro","Rent Split Pro","Salary Hourly Pro","Unit Converter Pro","Password Generator Pro"];
const icons=["🏦","💳","🛡️","₿","📈","💸","🏠","💼","🔄","🔐"];
const tags=["EARNING","EARNING","EARNING","EARNING","EARNING","VIRAL","VIRAL","VIRAL","VIRAL","VIRAL"];
let cur=0; const grid=document.getElementById('grid');
function render(){grid.innerHTML=""; names.forEach((n,i)=>{grid.innerHTML+=`<div class="card" onclick="openM(${i})"><div style="font-size:28px">${icons[i]}</div><b style="font-size:12.5px">${n}</b><br><span class="tag ${tags[i]=='EARNING'?'tag-earn':'tag-viral'}">${tags[i]}</span></div>`;});}
render();
function openM(i){
cur=i; document.getElementById('mtitle').innerText=names[i]; let h="";
if(i==0) h=`<label>Loan 1 EMI</label><input type="number" id="a" placeholder="15000"><label>Loan 2 EMI</label><input type="number" id="b" placeholder="13500"><label>Months</label><input type="number" id="c" placeholder="60">`;
if(i==1) h=`<label>On-time Payments %</label><input type="number" id="a" placeholder="95"><label>Credit Use %</label><input type="number" id="b" placeholder="30"><label>Age of Credit Years</label><input type="number" id="c" placeholder="5">`;
if(i==2) h=`<label>Cover Amount</label><input type="number" id="a" placeholder="1000000"><label>Rate per 1000</label><input type="number" id="b" placeholder="5"><label>Years</label><input type="number" id="c" placeholder="20">`;
if(i==3) h=`<label>Buy Price</label><input type="number" id="a" placeholder="30000"><label>Sell Price</label><input type="number" id="b" placeholder="50000"><label>Quantity</label><input type="number" id="c" placeholder="2">`;
if(i==4) h=`<label>Buy Price</label><input type="number" id="a" placeholder="100"><label>Sell Price</label><input type="number" id="b" placeholder="150"><label>Shares</label><input type="number" id="c" placeholder="100">`;
if(i==5) h=`<label>Bill Amount</label><input type="number" id="a" placeholder="1000"><label>Tip %</label><input type="number" id="b" placeholder="15"><label>People</label><input type="number" id="c" placeholder="3">`;
if(i==6) h=`<label>Total Rent / Bill</label><input type="number" id="a" placeholder="3000"><label>Number of People</label><input type="number" id="b" placeholder="4"><label>Extra Charges</label><input type="number" id="c" placeholder="200">`;
if(i==7) h=`<label>Monthly Salary</label><input type="number" id="a" placeholder="50000"><label>Work Days / Month</label><input type="number" id="b" placeholder="22"><label>Hours / Day</label><input type="number" id="c" placeholder="8">`;
if(i==8) h=`<label>Value</label><input type="number" id="a" placeholder="100"><label>Convert Type</label><select id="b"><option value="1">KG to LB</option><option value="2">KM to MILE</option><option value="3">CM to INCH</option><option value="4">Celsius to Fahrenheit</option></select>`;
if(i==9) h=`<label>Password Length</label><input type="number" id="a" placeholder="12"><label>Type</label><select id="c"><option value="1">Letters + Numbers + Symbols</option><option value="2">Only Letters + Numbers</option><option value="3">Only Numbers</option></select>`;
document.getElementById('minputs').innerHTML=h; document.getElementById('mres').className='res'; document.getElementById('modal').classList.add('show');
}
function closeM(){document.getElementById('modal').classList.remove('show');}
function gv(id){return parseFloat(document.getElementById(id)?.value)||0;}
function fmt(n){return n.toLocaleString('en-US');}
function calc(){
let r=document.getElementById('mres'),out="",a=gv('a'),b=gv('b'),c=gv('c');
let selB=document.getElementById('b'); let selBVal=selB?selB.value:"";
let selC=document.getElementById('c'); let selCText=selC?selC.options[selC.selectedIndex].text:"";
if(cur==0){let total1=a*c, total2=b*c, save=total1-total2; out=`<div class="big">Save: ${fmt(save)}</div>Total Loan 1: <b>${fmt(total1)}</b><br>Total Loan 2: <b>${fmt(total2)}</b><br>Monthly Save: <b>${fmt(a-b)}</b><br>Total Save: <b>${fmt(save)}</b><br>Best Choice: <b>${save>0?'Loan 2':'Loan 1'}</b><br>Savings Percent: <b>${(save/total1*100).toFixed(1)}%</b>`;}
else if(cur==1){let score=300 + (a*2.5) + ((100-b)*2) + (c*15); if(score>850) score=850; let cat=score>=750?"Excellent":score>=700?"Good":score>=650?"Fair":"Poor"; out=`<div class="big">Score: ${score.toFixed(0)} / 850</div>Estimated Score: <b>${score.toFixed(0)}</b><br>Category: <b>${cat}</b><br>On-time Payment: <b>${a}%</b><br>Utilization: <b>${b}%</b><br>Credit Age: <b>${c} Years</b><br>Max Possible: <b>850</b>`;}
else if(cur==2){let prem=a/1000*b, total=prem*c; out=`<div class="big">Yearly Premium: ${fmt(prem.toFixed(0))}</div>Cover Amount: <b>${fmt(a)}</b><br>Rate per 1000: <b>${b}</b><br>Yearly Premium: <b>${fmt(prem.toFixed(0))}</b><br>Policy Years: <b>${c}</b><br>Total Premium: <b>${fmt(total.toFixed(0))}</b><br>Cost per Day: <b>${fmt((prem/365).toFixed(0))}</b>`;}
else if(cur==3){let invested=a*c, current=b*c, profit=current-invested; out=`<div class="big">Profit: ${fmt(profit)}</div>Buy Total: <b>${fmt(invested)}</b><br>Sell Total: <b>${fmt(current)}</b><br>Quantity: <b>${c}</b><br>Profit Amount: <b>${fmt(profit)}</b><br>Return Percent: <b>${(profit/invested*100).toFixed(2)}%</b><br>Per Coin Profit: <b>${fmt(b-a)}</b>`;}
else if(cur==4){let invested=a*c, current=b*c, profit=current-invested; out=`<div class="big">Profit: ${fmt(profit)}</div>Invested Amount: <b>${fmt(invested)}</b><br>Current Value: <b>${fmt(current)}</b><br>Total Shares: <b>${c}</b><br>Net Profit: <b>${fmt(profit)}</b><br>Return Percent: <b>${(profit/invested*100).toFixed(2)}%</b><br>Per Share Gain: <b>${fmt(b-a)}</b>`;}
else if(cur==5){let tip=a*b/100, total=a+tip, per=total/c; out=`<div class="big">Total: ${fmt(total.toFixed(0))}</div>Bill Amount: <b>${fmt(a)}</b><br>Tip ${b}%: <b>${fmt(tip.toFixed(0))}</b><br>Grand Total: <b>${fmt(total.toFixed(0))}</b><br>Number of People: <b>${c}</b><br>Per Person: <b>${fmt(per.toFixed(0))}</b><br>Tip per Person: <b>${fmt((tip/c).toFixed(0))}</b>`;}
else if(cur==6){let total=a+c, per=total/b; out=`<div class="big">Per Person: ${fmt(per.toFixed(0))}</div>Total Rent: <b>${fmt(a)}</b><br>Extra Charges: <b>${fmt(c)}</b><br>Grand Total: <b>${fmt(total)}</b><br>Total People: <b>${b}</b><br>Each Pays: <b>${fmt(per.toFixed(0))}</b><br>Share Percent: <b>${(100/b).toFixed(1)}%</b>`;}
else if(cur==7){let daily=a/b, hourly=daily/c; out=`<div class="big">Hourly: ${fmt(hourly.toFixed(0))}</div>Monthly Salary: <b>${fmt(a)}</b><br>Daily Income: <b>${fmt(daily.toFixed(0))}</b><br>Hourly Income: <b>${fmt(hourly.toFixed(0))}</b><br>Weekly Income: <b>${fmt((daily*5).toFixed(0))}</b><br>Yearly Income: <b>${fmt((a*12).toFixed(0))}</b><br>Per Minute: <b>${(hourly/60).toFixed(2)}</b>`;}
else if(cur==8){let res=0, unit=""; if(selBVal=="1"){res=a*2.20462; unit="LB";} else if(selBVal=="2"){res=a*0.621371; unit="Miles";} else if(selBVal=="3"){res=a*0.393701; unit="Inches";} else {res=a*9/5+32; unit="F";} out=`<div class="big">${res.toFixed(2)} ${unit}</div>Input Value: <b>${a}</b><br>Converted Value: <b>${res.toFixed(2)} ${unit}</b><br>Conversion Type: <b>${document.getElementById('b').options[document.getElementById('b').selectedIndex].text}</b><br>Formula: <b>Standard International</b><br>Reverse Rate: <b>${(a!=0? (a/res).toFixed(4):0)}</b><br>Result: <b>${a} = ${res.toFixed(2)}</b>`;}
else if(cur==9){let chars=""; if(selCText.includes("Symbols")) chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%"; else if(selCText.includes("Letters")) chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"; else chars="0123456789"; let len=a||12; let pass=""; for(let i=0;i<len;i++) pass+=chars.charAt(Math.floor(Math.random()*chars.length)); let strength=len>=12?"Strong":len>=8?"Medium":"Weak"; out=`<div class="big">${pass}</div>Generated Password: <b>${pass}</b><br>Length: <b>${len}</b><br>Type: <b>${selCText}</b><br>Strength Level: <b>${strength}</b><br>Entropy: <b>${(len*Math.log2(chars.length)).toFixed(1)} bits</b><br>Security: <b>World Standard</b>`;}
r.innerHTML=out; r.classList.add('show');
}
</script>
</body>
</html>
