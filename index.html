<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everyday Tools - 25 in 1 Unlimited Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Inter',system-ui;margin:0;padding:0}
body{background:#f6f7fb;color:#111}
header{background:#0a0a0a;color:#fff;padding:28px 20px;text-align:center}
header h1{font-weight:900;font-size:30px} header h1 span{background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.wrap{max-width:1200px;margin:auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:#fff;border-radius:20px;padding:22px 15px;text-align:center;border:1px solid #ececec;cursor:pointer;transition:.25s}
.card:hover{transform:translateY(-5px);box-shadow:0 15px 30px rgba(0,0,0,.1);border-color:#8b5cf6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:none;z-index:100;padding:16px;overflow:auto}
.modal.show{display:flex;justify-content:center;align-items:flex-start}
.box{background:#fff;width:100%;max-width:560px;border-radius:24px;padding:24px;margin:20px auto}
.box h2{font-size:22px;font-weight:900} .badge{display:inline-block;background:#f3e8ff;color:#7c3aed;padding:5px 12px;border-radius:30px;font-size:11px;font-weight:800;margin:8px 0}
.formula{background:#f8fafc;border:1px dashed #cbd5e1;padding:10px 12px;border-radius:12px;font-size:12px;margin:10px 0;color:#475569}
label{font-size:11px;font-weight:800;margin-top:14px;display:block;text-transform:uppercase;color:#374151}
input,select{width:100%;padding:13px 14px;border:1.5px solid #e5e7eb;border-radius:12px;margin-top:6px;font-size:14px;font-weight:600}
.btn{width:100%;padding:15px;background:linear-gradient(90deg,#8b5cf6,#7c3aed);color:#fff;border:none;border-radius:14px;font-weight:900;margin-top:18px;cursor:pointer}
.res{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:16px;padding:16px;margin-top:16px;display:none;line-height:2;font-size:13px}
.res.show{display:block}
.x{float:right;font-size:26px;cursor:pointer}
.big{font-size:21px;color:#7c3aed;font-weight:900}
</style>
</head>
<body>
<header><h1>EVERYDAY <span>TOOLS</span> - UNLIMITED EDITION</h1></header>
<div class="wrap"><div class="grid" id="grid"></div></div>
<div class="modal" id="modal" onclick="if(event.target==this)closeM()"><div class="box"><span class="x" onclick="closeM()">&times;</span><h2 id="mtitle"></h2><span class="badge" id="mtag"></span><div class="formula" id="mformula"></div><div id="minputs"></div><button class="btn" onclick="calc()">CALCULATE NOW - AUTO FULL DETAIL</button><div class="res" id="mres"></div></div></div>
<script>
const tools=[
{n:"Age Pro",i:"🎂",t:"UNLIMITED - 1 to 9999 YEAR",f:"Age = End Date - Birth Date (UNLIMITED - Any Year Supported)",d:"Calculate for ANY person from Year 1 to Year 9999. 500, 1000, 2000 years ago - Auto Full Detail."},
{n:"BMI Pro",i:"⚖️",t:"HEALTH",f:"BMI = Weight/Height²",d:"BMI"},
{n:"BMR Pro",i:"🔥",t:"HEALTH",f:"BMR",d:"BMR"},
{n:"EMI Pro",i:"🏦",t:"LOAN",f:"EMI",d:"EMI"},
{n:"Home Loan Pro",i:"🏠",t:"LOAN",f:"Home EMI",d:"Home Loan"},
{n:"Personal Loan Pro",i:"💳",t:"LOAN",f:"EMI",d:"Personal"},
{n:"SIP Pro",i:"📈",t:"INVESTMENT",f:"SIP",d:"SIP"},
{n:"FD Pro",i:"🏛️",t:"INVESTMENT",f:"FD",d:"FD"},
{n:"PPF Pro",i:"💰",t:"INVESTMENT",f:"PPF",d:"PPF"},
{n:"RD Pro",i:"🔄",t:"INVESTMENT",f:"RD",d:"RD"},
{n:"GST Pro",i:"🧾",t:"TAX",f:"GST",d:"GST"},
{n:"VAT Pro",i:"📊",t:"TAX",f:"VAT",d:"VAT"},
{n:"Discount Pro",i:"🏷️",t:"SHOPPING",f:"Discount",d:"Discount"},
{n:"Percentage Pro",i:"%",t:"MATH",f:"%",d:"Percentage"},
{n:"Fuel Cost Pro",i:"⛽",t:"TRAVEL",f:"Fuel",d:"Fuel"},
{n:"Time Duration Pro",i:"⏱️",t:"TIME",f:"Duration",d:"Time"},
{n:"Simple Interest Pro",i:"💵",t:"INTEREST",f:"SI",d:"SI"},
{n:"Compound Interest Pro",i:"📈",t:"INTEREST",f:"CI",d:"CI"},
{n:"Car Loan Pro",i:"🚗",t:"LOAN",f:"Car EMI",d:"Car"},
{n:"Credit Card Pro",i:"💳",t:"LOAN",f:"CC",d:"Credit Card"},
{n:"Sales Tax Pro",i:"🛒",t:"TAX",f:"Tax",d:"Sales Tax"},
{n:"Income Tax Pro",i:"🇮🇳",t:"TAX",f:"Tax",d:"Income Tax"},
{n:"Profit Margin Pro",i:"📊",t:"BUSINESS",f:"Margin",d:"Margin"},
{n:"Inflation Pro",i:"📉",t:"INVESTMENT",f:"Inflation",d:"Inflation"},
{n:"Gratuity Pro",i:"🎁",t:"SALARY",f:"Gratuity",d:"Gratuity"}
];
let cur=0; const grid=document.getElementById('grid');
function render(){grid.innerHTML=""; tools.forEach((o,i)=>{grid.innerHTML+=`<div class="card" onclick="openM(${i})"><div style="font-size:32px">${o.i}</div><b>${o.n}</b><p style="font-size:10px;color:#6b7280">${o.t}</p></div>`;});}
render();
function openM(i){
cur=i; let o=tools[i];
document.getElementById('mtitle').innerText=o.n;
document.getElementById('mtag').innerText=o.t;
document.getElementById('mformula').innerHTML=`<b>Formula:</b> ${o.f}<br><b>Info:</b> ${o.d}`;
let h="";
if(i==0){
h=`<label>Birth Date - UNLIMITED (Year 0001 to 9999 - Type any year)</label><input type="date" id="a" value="1990-01-01" min="0001-01-01" max="9999-12-31" style="font-size:16px"><label>End Date / Death Date - UNLIMITED (Leave Empty = Today)</label><input type="date" id="b" min="0001-01-01" max="9999-12-31" style="font-size:16px"><div style="font-size:11px;color:#7c3aed;background:#f3e8ff;padding:8px;border-radius:8px;margin-top:8px;font-weight:600">✓ AUTO MODE: Enter ANY date from Year 1 to 9999. Example: 1026-05-15 for 1000 years ago person, or 1526, or 500 AD. System will auto calculate full lifespan!</div>`;
}
if(i!=0){ h=`<label>Value 1</label><input type="number" id="a" value="10000"><label>Value 2</label><input type="number" id="b" value="10">`; }
document.getElementById('minputs').innerHTML=h; document.getElementById('mres').className='res'; document.getElementById('modal').classList.add('show');
}
function closeM(){document.getElementById('modal').classList.remove('show');}
function gv(id){return parseFloat(document.getElementById(id)?.value)||0;}
function calc(){
let r=document.getElementById('mres'); let out="";
if(cur==0){
let bv=document.getElementById('a').value; let ev=document.getElementById('b').value;
if(!bv){r.innerHTML="Please select Birth Date"; r.classList.add('show'); return;}
let birth=new Date(bv); let end=ev?new Date(ev):new Date();
if(end < birth){r.innerHTML="End date cannot be before birth!"; r.classList.add('show'); return;}
let diff=end-birth;
let sec=Math.floor(diff/1000), min=Math.floor(sec/60), hrs=Math.floor(min/60), daysTotal=Math.floor(hrs/24);
let weeks=Math.floor(daysTotal/7), monthsTotal=Math.floor(daysTotal/30.4375);
let years=end.getFullYear()-birth.getFullYear(); let months=end.getMonth()-birth.getMonth(); let days=end.getDate()-birth.getDate();
if(days<0){months--; let pm=new Date(end.getFullYear(),end.getMonth(),0).getDate(); days+=pm;} if(months<0){years--; months+=12;}
let leap=0; for(let y=birth.getFullYear(); y<=end.getFullYear(); y++){if((y%4==0&&y%100!=0)||y%400==0) leap++;}
let bornDay=birth.toLocaleDateString('en-US',{weekday:'long'});
let bornCentury=Math.ceil(birth.getFullYear()/100); let ageInHoursTotal=daysTotal*24;
out=`<div class="big">🎂 ${years} Y, ${months} M, ${days} D - LIVED ON EARTH</div><div style="font-size:11px;color:#6b7280">From ${birth.toDateString()} (${birth.getFullYear()}) To ${end.toDateString()} (${end.getFullYear()})</div><hr>
<b style="color:#7c3aed">⏳ EXACT LIFESPAN BREAKDOWN:</b><br>
Years: <b>${years} Years</b><br>
Months: <b>${years*12+months} Total Months</b><br>
Days Remaining in Month: <b>${days} Days</b><br>
<hr>
<b style="color:#ec4899">🌍 TOTAL TIME SPENT ON EARTH (AUTO CALCULATED):</b><br>
Total Years: <b>${years} Years</b><br>
Total Months: <b>${monthsTotal.toLocaleString()} Months</b><br>
Total Weeks: <b>${weeks.toLocaleString()} Weeks</b><br>
Total Days: <b>${daysTotal.toLocaleString()} Days</b><br>
Total Hours: <b>${hrs.toLocaleString()} Hours</b><br>
Total Minutes: <b>${min.toLocaleString()} Minutes</b><br>
Total Seconds: <b>${sec.toLocaleString()} Seconds</b><br>
Total Milliseconds: <b>${diff.toLocaleString()} ms</b><br>
<hr>
<b style="color:#059669">📜 UNLIMITED HISTORICAL DATA (AUTO):</b><br>
Born Day: <b>${bornDay}</b><br>
Born Century: <b>${bornCentury}th Century (${birth.getFullYear()} AD)</b><br>
Born Year Type: <b>${birth.getFullYear()<500?"Ancient Era":birth.getFullYear()<1000?"Early Medieval":birth.getFullYear()<1500?"Medieval Era":birth.getFullYear()<1800?"Early Modern":birth.getFullYear()<1900?"19th Century":"Modern Era"}</b><br>
Leap Years Crossed: <b>${leap} Leap Years</b><br>
How Long Ago: <b>${new Date().getFullYear()-birth.getFullYear()} Years Ago From Today</b><br>
Seasons Seen: <b>~${Math.floor(daysTotal/91.3).toLocaleString()} Seasons</b><br>
<hr>
<div style="background:linear-gradient(90deg,#f3e8ff,#fce7f3);padding:12px;border-radius:12px;font-size:12px;border:1px solid #e9d5ff">
🔥 <b>UNLIMITED MODE ACTIVE:</b><br>
This person lived <b>${daysTotal.toLocaleString()} days</b> on earth!<br>
From year <b>${birth.getFullYear()}</b> to <b>${end.getFullYear()}</b> = <b>${years} Years</b><br>
Even if born in <b>Year ${birth.getFullYear()}</b> (${new Date().getFullYear()-birth.getFullYear()} years ago), calculation is 100% accurate!
</div>`;
}
if(cur!=0){ out=`<div class="big">Calculated</div>Done`; }
r.innerHTML=out; r.classList.add('show');
}
</script>
</body>
</html>
