<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everyday Tools - World Normal - Full Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Inter',system-ui;margin:0;padding:0}
body{background:#f6f7fb;color:#111}
header{background:#0a0a0a;color:#fff;padding:22px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-weight:900;font-size:26px} header h1 span{background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.wrap{max-width:1200px;margin:auto;padding:14px}
.search-wrap{max-width:600px;margin:14px auto;position:relative}
.search-wrap input{width:100%;padding:15px 20px 15px 46px;border-radius:40px;border:2px solid #e5e7eb;font-size:14px;font-weight:600;outline:none}
.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px}
.card{background:#fff;border-radius:18px;padding:18px 10px;text-align:center;border:1px solid #eee;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,.1);border-color:#8b5cf6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:99;padding:10px;overflow:auto}
.modal.show{display:flex;justify-content:center;align-items:flex-start}
.box{background:#fff;width:100%;max-width:540px;border-radius:22px;padding:20px;margin:20px auto}
.box h2{font-size:21px;font-weight:900}
label{font-size:10.5px;font-weight:800;margin-top:13px;display:block;text-transform:uppercase;color:#374151}
input,select{width:100%;padding:11px 10px;border:1.5px solid #e5e7eb;border-radius:10px;margin-top:5px;font-size:13.5px;font-weight:600;outline:none}
.date-row{display:grid;grid-template-columns:0.9fr 1.3fr 0.9fr;gap:6px}
.date-row select{font-size:12.5px;padding:11px 6px;background:#f8fafc;font-weight:700}
.btn{width:100%;padding:13px;background:linear-gradient(90deg,#8b5cf6,#7c3aed);color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:16px;cursor:pointer}
.res{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:14px;padding:14px;margin-top:14px;display:none;line-height:2;font-size:13px}
.res.show{display:block}
.x{float:right;font-size:26px;cursor:pointer}
.big{font-size:19px;color:#7c3aed;font-weight:900;line-height:1.3}
</style>
</head>
<body>
<header><h1>EVERYDAY <span>TOOLS</span> - WORLD</h1></header>
<div class="wrap">
<div class="search-wrap"><span>🔍</span><input id="search" placeholder="Search EMI, BMI, GST, SIP, Age Pro..." oninput="filterTools()"></div>
<div class="grid" id="grid"></div>
</div>
<div class="modal" id="modal" onclick="if(event.target==this)closeM()"><div class="box"><span class="x" onclick="closeM()">×</span><h2 id="mtitle"></h2><div id="minputs"></div><button class="btn" onclick="calc()">CALCULATE</button><div class="res" id="mres"></div></div></div>
<script>
const names=["Age Pro","BMI Pro","BMR Pro","EMI Pro","Home Loan Pro","Personal Loan Pro","SIP Pro","FD Pro","PPF Pro","RD Pro","GST Pro","VAT Pro","Discount Pro","Percentage Pro","Fuel Cost Pro","Time Duration Pro","Simple Interest Pro","Compound Interest Pro","Car Loan Pro","Credit Card Pro","Sales Tax Pro","Income Tax Pro","Profit Margin Pro","Inflation Pro","Gratuity Pro"];
const icons=["🎂","⚖️","🔥","🏦","🏠","💳","📈","🏛️","💰","🔄","🧾","📊","🏷️","%","⛽","⏱️","💵","📈","🚗","💳","🛒","💰","📊","📉","🎁"];
let cur=0; const grid=document.getElementById('grid');
function render(list){grid.innerHTML=""; list.forEach(i=>{grid.innerHTML+=`<div class="card" onclick="openM(${i})"><div style="font-size:28px">${icons[i]}</div><b style="font-size:12.5px">${names[i]}</b></div>`;});}
render(names.map((_,i)=>i));
function filterTools(){let q=document.getElementById('search').value.toLowerCase(); let f=names.map((n,i)=>({n,i})).filter(o=>o.n.toLowerCase().includes(q)).map(o=>o.i); render(f);}
function getSelectors(p){
let d='<option value="">Day</option>'; for(let i=1;i<=31;i++) d+=`<option value="${i}">${String(i).padStart(2,'0')}</option>`;
let m='<option value="">Month</option>'; let mn=["January","February","March","April","May","June","July","August","September","October","November","December"]; for(let i=1;i<=12;i++) m+=`<option value="${i}">${mn[i-1]}</option>`;
let y='<option value="">Year</option>'; for(let i=2026;i>=1;i--) y+=`<option value="${i}">${i}</option>`;
return `<div class="date-row"><select id="${p}_d">${d}</select><select id="${p}_m">${m}</select><select id="${p}_y">${y}</select></div>`;
}
function getDate(p){let d=document.getElementById(p+'_d')?.value, m=document.getElementById(p+'_m')?.value, y=document.getElementById(p+'_y')?.value; if(!d||!m||!y) return null; let dt=new Date(y,m-1,d); if(dt.getDate()!=d) return new Date('invalid'); return dt;}
function openM(i){
cur=i; document.getElementById('mtitle').innerText=names[i]; let h="";
if(i==0) h=`<label>Birth Date</label>${getSelectors('b')}<label>End Date (Empty = Today)</label>${getSelectors('e')}`;
if(i==1) h=`<label>Height cm</label><input type="number" id="a" placeholder="170"><label>Weight kg</label><input type="number" id="b" placeholder="65">`;
if(i==2) h=`<label>Gender</label><select id="a"><option value="m">Male</option><option value="f">Female</option></select><label>Age</label><input type="number" id="b" placeholder="25"><label>Height cm</label><input type="number" id="c" placeholder="170"><label>Weight kg</label><input type="number" id="d" placeholder="65">`;
if(i==3||i==4||i==5) h=`<label>Loan Amount</label><input type="number" id="a" placeholder="500000"><label>Interest % Annual</label><input type="number" id="b" placeholder="9"><label>Years</label><input type="number" id="c" placeholder="5">`;
if(i==6) h=`<label>Monthly Investment</label><input type="number" id="a" placeholder="5000"><label>Return % Annual</label><input type="number" id="b" placeholder="12"><label>Years</label><input type="number" id="c" placeholder="10">`;
if(i==7) h=`<label>Principal</label><input type="number" id="a" placeholder="100000"><label>Rate %</label><input type="number" id="b" placeholder="7"><label>Years</label><input type="number" id="c" placeholder="5">`;
if(i==8) h=`<label>Yearly Investment</label><input type="number" id="a" placeholder="150000"><label>Rate %</label><input type="number" id="b" placeholder="7.1"><label>Years</label><input type="number" id="c" placeholder="15">`;
if(i==9) h=`<label>Monthly Deposit</label><input type="number" id="a" placeholder="5000"><label>Rate %</label><input type="number" id="b" placeholder="6.5"><label>Months</label><input type="number" id="c" placeholder="60">`;
if(i==10||i==11) h=`<label>Amount</label><input type="number" id="a" placeholder="1000"><label>Tax %</label><input type="number" id="b" placeholder="18"><label>Type</label><select id="c"><option value="ex">Exclusive (Add Tax)</option><option value="in">Inclusive (Remove Tax)</option></select>`;
if(i==12) h=`<label>Original Price</label><input type="number" id="a" placeholder="1000"><label>Discount %</label><input type="number" id="b" placeholder="20">`;
if(i==13) h=`<label>Total Value</label><input type="number" id="a" placeholder="500"><label>Percent %</label><input type="number" id="b" placeholder="15">`;
if(i==14) h=`<label>Distance km</label><input type="number" id="a" placeholder="100"><label>Mileage km/l</label><input type="number" id="b" placeholder="15"><label>Fuel Price /L</label><input type="number" id="c" placeholder="105">`;
if(i==15) h=`<label>Start Date</label>${getSelectors('s')}<label>End Date</label>${getSelectors('e2')}`;
if(i==16) h=`<label>Principal</label><input type="number" id="a" placeholder="10000"><label>Rate %</label><input type="number" id="b" placeholder="8"><label>Years</label><input type="number" id="c" placeholder="2">`;
if(i==17) h=`<label>Principal</label><input type="number" id="a" placeholder="10000"><label>Rate %</label><input type="number" id="b" placeholder="8"><label>Years</label><input type="number" id="c" placeholder="5"><label>Compounds Per Year</label><input type="number" id="d" value="4">`;
if(i==18) h=`<label>Car Price</label><input type="number" id="a" placeholder="800000"><label>Down Payment</label><input type="number" id="b" placeholder="100000"><label>Interest %</label><input type="number" id="c" placeholder="9"><label>Years</label><input type="number" id="d" placeholder="5">`;
if(i==19) h=`<label>Due Amount</label><input type="number" id="a" placeholder="10000"><label>Monthly Interest %</label><input type="number" id="b" placeholder="3.5">`;
if(i==20) h=`<label>Product Price</label><input type="number" id="a" placeholder="1000"><label>Sales Tax %</label><input type="number" id="b" placeholder="8">`;
if(i==21) h=`<label>Annual Income</label><input type="number" id="a" placeholder="800000"><label>Tax Rate %</label><input type="number" id="b" placeholder="20">`;
if(i==22) h=`<label>Cost Price</label><input type="number" id="a" placeholder="500"><label>Selling Price</label><input type="number" id="b" placeholder="700">`;
if(i==23) h=`<label>Current Amount</label><input type="number" id="a" placeholder="100000"><label>Inflation %</label><input type="number" id="b" placeholder="6"><label>After Years</label><input type="number" id="c" placeholder="10">`;
if(i==24) h=`<label>Last Salary</label><input type="number" id="a" placeholder="50000"><label>Years Service</label><input type="number" id="b" placeholder="7">`;
document.getElementById('minputs').innerHTML=h; document.getElementById('mres').className='res'; document.getElementById('modal').classList.add('show');
}
function closeM(){document.getElementById('modal').classList.remove('show');}
function gv(id){return parseFloat(document.getElementById(id)?.value)||0;}
function fmt(n){return n.toLocaleString('en-US');}
function calc(){
let r=document.getElementById('mres'),out="",a=gv('a'),b=gv('b'),c=gv('c'),d=gv('d');
if(cur==0){
let birth=getDate('b'), end=getDate('e'); if(!birth){r.innerHTML="Select Birth Date"; r.classList.add('show'); return;} if(isNaN(birth)){r.innerHTML="Invalid Date"; r.classList.add('show'); return;} if(!end) end=new Date();
let diff=end-birth,sec=Math.floor(diff/1000),min=Math.floor(sec/60),hrs=Math.floor(min/60),days=Math.floor(hrs/24);
let y=end.getFullYear()-birth.getFullYear(),m=end.getMonth()-birth.getMonth(),day=end.getDate()-birth.getDate(); if(day<0){m--;let pm=new Date(end.getFullYear(),end.getMonth(),0).getDate(); day+=pm;} if(m<0){y--;m+=12;}
out=`<div class="big">${y} Y, ${m} M, ${day} D Lived</div>
Total Months: <b>${fmt(y*12+m)} Months</b><br>
Total Weeks: <b>${fmt(Math.floor(days/7))} Weeks</b><br>
Total Days: <b>${fmt(days)} Days</b><br>
Total Hours: <b>${fmt(hrs)} Hours</b><br>
Total Minutes: <b>${fmt(min)} Minutes</b><br>
Total Seconds: <b>${fmt(sec)} Seconds</b><br>
Born: <b>${birth.toDateString()}</b><br>
End: <b>${end.toDateString()}</b>`;
}
else if(cur==1){let h=a/100,bmi=b/(h*h),cat=bmi<18.5?"Underweight":bmi<25?"Normal":bmi<30?"Overweight":"Obese"; out=`<div class="big">BMI: ${bmi.toFixed(2)}</div>Category: <b>${cat}</b><br>Ideal Weight: <b>${(22*h*h).toFixed(1)} kg</b><br>Healthy BMI Range: <b>18.5 - 24.9</b><br>Height: <b>${a} cm</b><br>Weight: <b>${b} kg</b><br>BMI Prime: <b>${(bmi/25).toFixed(2)}</b>`;}
else if(cur==2){let g=document.getElementById('a').value,bmr=g=='m'?88.362+13.397*d+4.799*c-5.677*b:447.593+9.247*d+3.098*c-4.33*b; out=`<div class="big">BMR: ${bmr.toFixed(0)} kcal/day</div>Base Metabolism: <b>${bmr.toFixed(0)}</b><br>Sedentary (x1.2): <b>${(bmr*1.2).toFixed(0)}</b><br>Light (x1.375): <b>${(bmr*1.375).toFixed(0)}</b><br>Moderate (x1.55): <b>${(bmr*1.55).toFixed(0)}</b><br>Active (x1.725): <b>${(bmr*1.725).toFixed(0)}</b><br>Very Active (x1.9): <b>${(bmr*1.9).toFixed(0)}</b>`;}
else if(cur==3||cur==4||cur==5){let rate=b/12/100,n=c*12,emi=a*rate*Math.pow(1+rate,n)/(Math.pow(1+rate,n)-1),total=emi*n,intr=total-a; out=`<div class="big">EMI: ${fmt(emi.toFixed(0))} /month</div>Loan Amount: <b>${fmt(a)}</b><br>Interest Rate: <b>${b}%</b><br>Tenure: <b>${c} Years (${n} months)</b><br>Total Interest: <b>${fmt(intr.toFixed(0))}</b><br>Total Payment: <b>${fmt(total.toFixed(0))}</b><br>Interest % of Loan: <b>${(intr/a*100).toFixed(1)}%</b>`;}
else if(cur==6){let ret=b/12/100,n=c*12,fv=a*((Math.pow(1+ret,n)-1)/ret)*(1+ret),inv=a*n,gain=fv-inv; out=`<div class="big">Maturity: ${fmt(fv.toFixed(0))}</div>Monthly: <b>${fmt(a)}</b><br>Return: <b>${b}%</b><br>Years: <b>${c} (${n} months)</b><br>Total Invested: <b>${fmt(inv)}</b><br>Wealth Gain: <b>${fmt(gain.toFixed(0))}</b><br>Growth: <b>${(gain/inv*100).toFixed(1)}%</b>`;}
else if(cur==7){let fv=a*Math.pow(1+b/100,c),intr=fv-a; out=`<div class="big">Maturity: ${fmt(fv.toFixed(0))}</div>Principal: <b>${fmt(a)}</b><br>Rate: <b>${b}%</b><br>Years: <b>${c}</b><br>Interest Earned: <b>${fmt(intr.toFixed(0))}</b><br>Total Growth: <b>${(intr/a*100).toFixed(1)}%</b><br>Yearly Avg Interest: <b>${fmt((intr/c).toFixed(0))}</b>`;}
else if(cur==8){let fv=a*(((Math.pow(1+b/100,c)-1)/(b/100))),inv=a*c,gain=fv-inv; out=`<div class="big">Maturity: ${fmt(fv.toFixed(0))}</div>Yearly: <b>${fmt(a)}</b><br>Rate: <b>${b}%</b><br>Years: <b>${c}</b><br>Invested: <b>${fmt(inv)}</b><br>Gain: <b>${fmt(gain.toFixed(0))}</b><br>Total Return: <b>${(gain/inv*100).toFixed(1)}%</b>`;}
else if(cur==9){let rate=b/12/100,fv=a*((Math.pow(1+rate,c)-1)/rate),inv=a*c; out=`<div class="big">Maturity: ${fmt(fv.toFixed(0))}</div>Monthly: <b>${fmt(a)}</b><br>Rate: <b>${b}%</b><br>Months: <b>${c}</b><br>Invested: <b>${fmt(inv)}</b><br>Interest: <b>${fmt((fv-inv).toFixed(0))}</b><br>Return %: <b>${((fv-inv)/inv*100).toFixed(1)}%</b>`;}
else if(cur==10||cur==11){let type=document.getElementById('c').value,tax,base,total; if(type=='ex'){tax=a*b/100; total=a+tax; base=a;}else{total=a; tax=a-a*100/(100+b); base=total-tax;} out=`<div class="big">Tax: ${tax.toFixed(2)}</div>Base Amount: <b>${base.toFixed(2)}</b><br>Tax Rate: <b>${b}%</b><br>Tax Amount: <b>${tax.toFixed(2)}</b><br>Total Amount: <b>${total.toFixed(2)}</b><br>Type: <b>${type=='ex'?'Exclusive':'Inclusive'}</b><br>Effective Rate: <b>${b}%</b>`;}
else if(cur==12){let save=a*b/100,pay=a-save; out=`<div class="big">Pay: ${fmt(pay.toFixed(0))}</div>Original: <b>${fmt(a)}</b><br>Discount: <b>${b}%</b><br>You Save: <b>${fmt(save.toFixed(0))}</b><br>Final Price: <b>${fmt(pay.toFixed(0))}</b><br>Savings: <b>${b}% OFF</b><br>You Save: <b>${b}% of value</b>`;}
else if(cur==13){let res=a*b/100,rem=a-res; out=`<div class="big">${b}% of ${fmt(a)} = ${fmt(res)}</div>Total Value: <b>${fmt(a)}</b><br>Percentage: <b>${b}%</b><br>Result: <b>${fmt(res)}</b><br>Remaining: <b>${fmt(rem)}</b><br>Calculation: <b>${a} x ${b}%</b><br>Ratio: <b>${b}/100</b>`;}
else if(cur==14){let fuel=a/b,cost=fuel*c; out=`<div class="big">Fuel Cost: ${fmt(cost.toFixed(0))}</div>Distance: <b>${a} km</b><br>Mileage: <b>${b} km/l</b><br>Fuel Price: <b>${c} /L</b><br>Fuel Needed: <b>${fuel.toFixed(2)} L</b><br>Cost per km: <b>${(cost/a).toFixed(2)}</b><br>Round Trip Cost: <b>${fmt((cost*2).toFixed(0))}</b>`;}
else if(cur==15){let s=getDate('s'),e=getDate('e2'); if(!s||!e||isNaN(s)){r.innerHTML="Select both dates"; r.classList.add('show'); return;} let diff=Math.abs(e-s),days=Math.ceil(diff/(1000*60*60*24)),hrs=days*24; out=`<div class="big">${days} Days</div>Start: <b>${s.toDateString()}</b><br>End: <b>${e.toDateString()}</b><br>Total Days: <b>${fmt(days)}</b><br>Total Hours: <b>${fmt(hrs)}</b><br>Total Weeks: <b>${(days/7).toFixed(1)}</b><br>Months Approx: <b>${(days/30.44).toFixed(1)}</b><br>Years Approx: <b>${(days/365.25).toFixed(2)}</b>`;}
else if(cur==16){let si=a*b*c/100,total=a+si; out=`<div class="big">Interest: ${fmt(si.toFixed(0))}</div>Principal: <b>${fmt(a)}</b><br>Rate: <b>${b}%</b><br>Years: <b>${c}</b><br>Simple Interest: <b>${fmt(si.toFixed(0))}</b><br>Total Amount: <b>${fmt(total.toFixed(0))}</b><br>Monthly Interest: <b>${fmt((si/(c*12)).toFixed(0))}</b>`;}
else if(cur==17){let fv=a*Math.pow(1+b/100/d,d*c),intr=fv-a; out=`<div class="big">Total: ${fmt(fv.toFixed(0))}</div>Principal: <b>${fmt(a)}</b><br>Rate: <b>${b}%</b><br>Years: <b>${c}</b><br>Compounds: <b>${d}/year</b><br>Interest: <b>${fmt(intr.toFixed(0))}</b><br>Growth: <b>${(intr/a*100).toFixed(1)}%</b><br>Effective Annual Rate: <b>${((Math.pow(1+b/100/d,d)-1)*100).toFixed(2)}%</b>`;}
else if(cur==18){let loan=a-b,rate=c/12/100,n=d*12,emi=loan*rate*Math.pow(1+rate,n)/(Math.pow(1+rate,n)-1),total=emi*n; out=`<div class="big">EMI: ${fmt(emi.toFixed(0))}/month</div>Car Price: <b>${fmt(a)}</b><br>Down Payment: <b>${fmt(b)}</b><br>Loan: <b>${fmt(loan)}</b><br>Interest: <b>${c}%</b><br>Years: <b>${d}</b><br>Total Interest: <b>${fmt((total-loan).toFixed(0))}</b><br>Total Payment: <b>${fmt(total.toFixed(0))}</b>`;}
else if(cur==19){let intr=a*b/100,total=a+intr,mindue=a*0.05; out=`<div class="big">Interest: ${fmt(intr.toFixed(0))}</div>Due Amount: <b>${fmt(a)}</b><br>Monthly Rate: <b>${b}%</b><br>Interest Charge: <b>${fmt(intr.toFixed(0))}</b><br>Total Due: <b>${fmt(total.toFixed(0))}</b><br>Min Payment (5%): <b>${fmt(mindue.toFixed(0))}</b><br>Remaining: <b>${fmt((total-mindue).toFixed(0))}</b>`;}
else if(cur==20){let tax=a*b/100,total=a+tax; out=`<div class="big">Sales Tax: ${fmt(tax.toFixed(0))}</div>Product Price: <b>${fmt(a)}</b><br>Tax Rate: <b>${b}%</b><br>Tax: <b>${fmt(tax.toFixed(0))}</b><br>Total Price: <b>${fmt(total.toFixed(0))}</b><br>Tax % of Total: <b>${(tax/total*100).toFixed(1)}%</b>`;}
else if(cur==21){let tax=a*b/100,net=a-tax; out=`<div class="big">Tax: ${fmt(tax.toFixed(0))}</div>Annual Income: <b>${fmt(a)}</b><br>Tax Rate: <b>${b}%</b><br>Tax Amount: <b>${fmt(tax.toFixed(0))}</b><br>Net Income: <b>${fmt(net.toFixed(0))}</b><br>Monthly Net: <b>${fmt((net/12).toFixed(0))}</b><br>Effective Rate: <b>${b}%</b>`;}
else if(cur==22){let profit=b-a,margin=profit/b*100,markup=profit/a*100; out=`<div class="big">Margin: ${margin.toFixed(2)}%</div>Cost: <b>${fmt(a)}</b><br>Selling: <b>${fmt(b)}</b><br>Profit: <b>${fmt(profit)}</b><br>Margin: <b>${margin.toFixed(2)}%</b><br>Markup: <b>${markup.toFixed(2)}%</b><br>Profit Ratio: <b>${(profit/a).toFixed(2)}</b>`;}
else if(cur==23){let fut=a/Math.pow(1+b/100,c),loss=a-fut; out=`<div class="big">Future Value: ${fmt(fut.toFixed(0))}</div>Current: <b>${fmt(a)}</b><br>Inflation: <b>${b}%</b><br>After: <b>${c} Years</b><br>Future Worth: <b>${fmt(fut.toFixed(0))}</b><br>Purchasing Power Loss: <b>${fmt(loss.toFixed(0))}</b><br>Value Retained: <b>${(fut/a*100).toFixed(1)}%</b>`;}
else if(cur==24){let grat=(15*a*b)/26,monthly=a/26*15; out=`<div class="big">Gratuity: ${fmt(grat.toFixed(0))}</div>Last Salary: <b>${fmt(a)}</b><br>Years: <b>${b}</b><br>Formula: <b>(15 x Salary x Years)/26</b><br>Per Year: <b>${fmt(monthly.toFixed(0))}</b><br>Total Gratuity: <b>${fmt(grat.toFixed(0))}</b><br>Monthly Avg: <b>${fmt((grat/(b*12)).toFixed(0))}</b>`;}
r.innerHTML=out; r.classList.add('show');
}
</script>
</body>
</html>
