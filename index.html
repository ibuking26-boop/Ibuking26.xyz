<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everyday Tools - 1-25 Master</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Inter',system-ui;margin:0;padding:0}
body{background:#f6f7fb;color:#111}
header{background:#0a0a0a;color:#fff;padding:22px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-weight:900;font-size:20px} header h1 span{background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.wrap{max-width:1200px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.main-dabba{grid-column:span 2;background:white;border-radius:24px;padding:40px 20px;text-align:center;box-shadow:0 4px 25px rgba(0,0,0,0.06);cursor:pointer}
@media(min-width:700px){.main-dabba{grid-column:span 4}}
.logo-box{width:90px;height:90px;margin:0 auto 14px;background:linear-gradient(145deg,#0a0a0a,#2a2a2a);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:0 10px 25px rgba(0,0,0,0.3)}
.card{background:white;border-radius:18px;padding:18px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.05);cursor:pointer}
.hidden{display:none}
.back{border:none;background:#0a0a0a;color:white;padding:10px 18px;border-radius:12px;margin-bottom:14px}
</style>
</head>
<body>
<header><h1>ibuking26.<span>xyz</span> - Everyday Tools</h1></header>
<div class="wrap">

<!-- HOME: SIRF 1 DABBA -->
<div id="homeView">
<div class="grid">
<div class="main-dabba" onclick="openBox()">
<div class="logo-box">🧮</div>
<h2 style="font-weight:800">Calculator Pro</h2>
<p style="color:#666;margin-top:6px">25 Tools - Tap to Open</p>
</div>
</div>
</div>

<!-- ANDAR: 1-25 TOOLS -->
<div id="boxView" class="hidden">
<button class="back" onclick="closeBox()">← Back</button>
<div class="grid" id="tools"></div>
</div>

</div>
<script>
let list=["Age Calculator","BMI Calculator","EMI Calculator","GST Calculator","SIP Calculator","FD Calculator","PPF Calculator","Loan Calculator","Discount Calculator","Percentage Calculator","Profit Loss Calculator","Salary Calculator","Tip Calculator","Speed Calculator","Fuel Calculator","Electricity Bill Calculator","Water Usage Calculator","Weight Converter","Length Converter","Area Converter","Temperature Converter","Time Calculator","Date Calculator","Interest Calculator","Tax Calculator"];
let g=document.getElementById('tools');
list.forEach((t,i)=>{g.innerHTML+=`<div class="card"><div style="font-size:32px">🧮</div><div style="font-weight:600;margin-top:8px;font-size:13px">${t}</div><div style="font-size:11px;color:#999;margin-top:4px">Tool ${i+1}</div></div>`});
function openBox(){homeView.classList.add('hidden');boxView.classList.remove('hidden');window.scrollTo(0,0)}
function closeBox(){boxView.classList.add('hidden');homeView.classList.remove('hidden')}
</script>
</body>
</html>
