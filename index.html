<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everyday Tools - 25 in 1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Inter',system-ui;margin:0;padding:0}
body{background:#f6f7fb;color:#111}
header{background:#0a0a0a;color:#fff;padding:28px 20px;text-align:center}
header h1{font-weight:900;font-size:28px} header h1 span{background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.wrap{max-width:1200px;margin:auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:#fff;border-radius:20px;padding:22px 15px;text-align:center;border:1px solid #ececec;cursor:pointer;transition:.25s}
.card:hover{transform:translateY(-5px);box-shadow:0 15px 30px rgba(0,0,0,.1);border-color:#8b5cf6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:none;z-index:100;padding:16px;overflow:auto}
.modal.show{display:flex;justify-content:center;align-items:flex-start}
.box{background:#fff;width:100%;max-width:560px;border-radius:24px;padding:24px;margin:20px auto}
.box h2{font-size:22px;font-weight:900}
label{font-size:11px;font-weight:800;margin-top:14px;display:block;text-transform:uppercase;color:#374151}
input,select{width:100%;padding:13px 14px;border:1.5px solid #e5e7eb;border-radius:12px;margin-top:6px;font-size:14px;font-weight:600}
.btn{width:100%;padding:15px;background:linear-gradient(90deg,#8b5cf6,#7c3aed);color:#fff;border:none;border-radius:14px;font-weight:900;margin-top:18px;cursor:pointer}
.res{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:16px;padding:16px;margin-top:16px;display:none;line-height:2;font-size:13px}
.res.show{display:block}
.x{float:right;font-size:26px;cursor:pointer}
.big{font-size:21px;color:#7c3aed;font-weight:900}
</style>
</head>
<body>
<header><h1>EVERYDAY <span>TOOLS</span></h1></header>
<div class="wrap"><div class="grid" id="grid"></div></div>
<div class="modal" id="modal" onclick="if(event.target==this)closeM()"><div class="box"><span class="x" onclick="closeM()">&times;</span><h2 id="mtitle"></h2><div id="minputs"></div><button class="btn" onclick="calc()">CALCULATE NOW</button><div class="res" id="mres"></div></div></div>
<script>
const tools=[{n:"Age Pro",i:"🎂"},{n:"BMI Pro",i:"⚖️"},{n:"BMR Pro",i:"🔥"},{n:"EMI Pro",i:"🏦"},{n:"Home Loan Pro",i:"🏠"},{n:"Personal Loan Pro",i:"💳"},{n:"SIP Pro",i:"📈"},{n:"FD Pro",i:"🏛️"},{n:"PPF Pro",i:"💰"},{n:"RD Pro",i:"🔄"},{n:"GST Pro",i:"🧾"},{n:"VAT Pro",i:"📊"},{n:"Discount Pro",i:"🏷️"},{n:"Percentage Pro",i:"%"},{n:"Fuel Cost Pro",i:"⛽"},{n:"Time Duration Pro",i:"⏱️"},{n:"Simple Interest Pro",i:"💵"},{n:"Compound Interest Pro",i:"📈"},{n:"Car Loan Pro",i:"🚗"},{n:"Credit Card Pro",i:"💳"},{n:"Sales Tax Pro",i:"🛒"},{n:"Income Tax Pro",i:"🇮🇳"},{n:"Profit Margin Pro",i:"📊"},{n:"Inflation Pro",i:"📉"},{n:"Gratuity Pro",i:"🎁"}];
let cur=0; const grid=document.getElementById('grid');
function render(){grid.innerHTML=""; tools.forEach((o,i)=>{grid.innerHTML+=`<div class="card" onclick="openM(${i})"><div style="font-size:32px">${o.i}</div><b>${o.n}</b></div>`;});}
render();
function openM(i){
cur=i; document.getElementById('mtitle').innerText=tools[i].n;
let h="";
if(i==0){
h=`<label>Birth Date (Unlimited - Any Year)</label><input type="date" id="a" value="1990-01-01" min="0001-01-01" max="9999-12-31"><label>End Date / Death Date (Leave Empty = Today)</label><input type="date" id="b" min="0001-01-01" max="9999-12-31">`;
} else { h=`<label>Value 1</label><input type="number" id="a" value="10000"><label>Value 2</label><input type="number" id="b" value="10">`; }
document.getElementById('minputs').innerHTML=h; document.getElementById('mres').className='res'; document.getElementById('modal').classList.add('show');
}
function closeM(){document.getElementById('modal').classList.remove('show');}
function gv(id){return parseFloat(document.getElementById(id)?.value)||0;}
function calc(){
let r=document.getElementById('mres'); let out="";
if(cur==0){
let bv=document.getElementById('a').value; let ev=document.getElementById('b').value;
if(!bv){r.innerHTML="Please select Birth Date"; r.classList.add('show'); return;}
let birth=new Date(bv); let end=ev?new Date(ev):new Date();
if(end < birth){r.innerHTML="End date cannot be before birth!"; r.classList.add('show'); return;}
let diff=end-birth;
let sec=Math.floor(diff/1000), min=Math.floor(sec/60), hrs=Math.floor(min/60), daysTotal=Math.floor(hrs/24);
let weeks=Math.floor(daysTotal/7), monthsTotal=Math.floor(daysTotal/30.4375);
let years=end.getFullYear()-birth.getFullYear(); let months=end.getMonth()-birth.getMonth(); let days=end.getDate()-birth.getDate();
if(days<0){months--; let pm=new Date(end.getFullYear(),end.getMonth(),0).getDate(); days+=pm;} if(months<0){years--; months+=12;}
let leap=0; for(let y=birth.getFullYear(); y<=end.getFullYear(); y++){if((y%4==0&&y%100!=0)||y%400==0) leap++;}
out=`<div class="big">🎂 ${years} Years, ${months} Months, ${days} Days</div><div style="font-size:11px;color:#6b7280">From ${birth.toDateString()} To ${end.toDateString()}</div><hr>
<b>EXACT BREAKDOWN:</b><br>Years: <b>${years}</b><br>Months: <b>${years*12+months}</b><br>Days: <b>${days}</b><hr>
<b>TOTAL TIME ON EARTH:</b><br>Total Years: <b>${years}</b><br>Total Months: <b>${monthsTotal.toLocaleString()}</b><br>Total Weeks: <b>${weeks.toLocaleString()}</b><br>Total Days: <b>${daysTotal.toLocaleString()}</b><br>Total Hours: <b>${hrs.toLocaleString()}</b><br>Total Minutes: <b>${min.toLocaleString()}</b><br>Total Seconds: <b>${sec.toLocaleString()}</b><hr>
<b>HISTORICAL DATA:</b><br>Born Day: <b>${birth.toLocaleDateString('en-US',{weekday:'long'})}</b><br>Century: <b>${Math.ceil(birth.getFullYear()/100)}th Century (${birth.getFullYear()})</b><br>Leap Years: <b>${leap}</b><br>Seasons: <b>~${Math.floor(daysTotal/91.3)}</b>`;
}
r.innerHTML=out; r.classList.add('show');
}
</script>
</body>
</html>
