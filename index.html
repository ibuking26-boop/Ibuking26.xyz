<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools 25 in 1 Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#f1f5f9}
.topbar{background:#0d4a7a;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-size:14px}
.topbar span{font-weight:700}
.appmysite-bar{background:#3b82f6;color:#fff;text-align:center;padding:6px;font-size:12px}
.search-wrap{padding:10px 12px;background:#fff}
.search{width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:20px;background:#f8fafc;font-size:13px;outline:none}
.ad-space{margin:10px 12px;border:1.5px dashed #a78bfa;border-radius:10px;padding:12px;text-align:center;color:#7c3aed;font-size:12px;background:#faf5ff}
.container{padding:8px 10px 80px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:12px;padding:18px 10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.05);cursor:pointer;border:1px solid #f1f5f9}
.card .icon{font-size:28px;display:block;margin-bottom:6px}
.card b{font-size:12px;color:#0f172a;display:block}
.card small{font-size:9px;color:#22c55e;font-weight:700;margin-top:3px;display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0f3b66;display:flex;justify-content:space-around;padding:8px 0;color:#cbd5e1;font-size:10px}
.bottom-nav div{text-align:center;flex:1}
.bottom-nav b{display:block;font-size:16px}
.bottom-nav .active{color:#fff}
.view{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#f1f5f9;z-index:99;overflow:auto;padding-bottom:80px}
.view.active{display:block}
.calc-header{background:#0d4a7a;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.calc-header button{background:#fff;color:#0d4a7a;border:none;padding:6px 12px;border-radius:8px;font-weight:700}
.calc-box{background:#fff;margin:12px;border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.row{display:flex;gap:8px;margin-top:8px}
.row input{flex:1;padding:12px;border:1px solid #d1d5db;border-radius:10px;text-align:center}
label{font-size:13px;font-weight:700;margin-top:12px;display:block}
.btn{width:100%;background:#4f46e5;color:#fff;border:none;padding:13px;border-radius:10px;font-weight:800;margin-top:14px}
.result{margin-top:12px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:12px;display:none}
.result.show{display:block}
.r-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
</style>
</head>
<body>
<div class="topbar"><span>☰ Toolz26.xyz</span><span>↻</span></div>
<div class="appmysite-bar">This app was built on AppMySite</div>
<div class="search-wrap"><input class="search" placeholder="🔍 Search EMI, BMI, GST, SIP, Age Pro... (200)"></div>
<div class="ad-space">AD SPACE TOP - AdSense</div>
<div class="container"><div class="grid" id="homeGrid"></div><div class="ad-space" style="margin-top:14px">AD SPACE BOTTOM - AdSense | About Us | Privacy Policy | Contact Us | Disclaimer</div></div>
<div class="bottom-nav"><div class="active"><b>⌂</b>Home</div><div><b>ℹ</b>About us</div><div><b>☰</b>Categories</div><div><b>🔒</b>Privacy</div><div><b>✉</b>Contact</div></div>
<div id="calcViews"></div>
<script>
const tools=[{id:'age',name:'Age Pro',icon:'🎂'},{id:'bmi',name:'BMI Pro',icon:'⚖️'},{id:'bmr',name:'BMR Pro',icon:'🔥'},{id:'emi',name:'EMI Pro',icon:'🏦'},{id:'home',name:'Home Loan Pro',icon:'🏠'},{id:'personal',name:'Personal Loan Pro',icon:'💰'},{id:'sip',name:'SIP Pro',icon:'📈'},{id:'fd',name:'FD Pro',icon:'🏛️'},{id:'ppf',name:'PPF Pro',icon:'🔒'},{id:'rd',name:'RD Pro',icon:'🔄'},{id:'gst',name:'GST Pro',icon:'🧾'},{id:'vat',name:'VAT Pro',icon:'💵'},{id:'discount',name:'Discount Pro',icon:'🏷️'},{id:'percentage',name:'Percentage Pro',icon:'%'},{id:'fuel',name:'Fuel Cost Pro',icon:'⛽'},{id:'time',name:'Time Duration Pro',icon:'⏳'},{id:'si',name:'Simple Interest Pro',icon:'💲'},{id:'ci',name:'Compound Interest Pro',icon:'📊'},{id:'car',name:'Car Loan Pro',icon:'🚗'},{id:'credit',name:'Credit Card Pro',icon:'💳'},{id:'sales',name:'Sales Tax Pro',icon:'🛒'},{id:'income',name:'Income Tax Pro',icon:'📑'},{id:'profit',name:'Profit Margin Pro',icon:'📊'},{id:'inflation',name:'Inflation Pro',icon:'📉'},{id:'gratuity',name:'Gratuity Pro',icon:'🎁'}];
const grid=document.getElementById('homeGrid');const views=document.getElementById('calcViews');
tools.forEach(t=>{grid.innerHTML+=`<div class="card" onclick="openTool('${t.id}')"><span class="icon">${t.icon}</span><b>${t.name}</b><small>✓ LOCKED</small></div>`;views.innerHTML+=`<div class="view" id="view-${t.id}"><div class="calc-header"><button onclick="goHome()">← Back</button><b>${t.name}</b></div><div class="calc-box" id="box-${t.id}">Loading...</div></div>`;});
document.getElementById('box-age').innerHTML=`<label>Birth Date</label><div class="row"><input type="number" id="bd" placeholder="Day"><input type="number" id="bm" placeholder="Month"><input type="number" id="by" placeholder="Year"></div><label>Target Date</label><div class="row"><input type="number" id="td" placeholder="Day"><input type="number" id="tm" placeholder="Month"><input type="number" id="ty" placeholder="Year"></div><button class="btn" onclick="calcAge()">Calculate Age Full Detail</button><div class="result" id="res-age"></div>`;
const simpleInputs={bmi:`<label>Weight kg</label><input id="bmi_w"><label>Height cm</label><input id="bmi_h"><style>#box-bmi input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcBMI()">Calculate</button><div class="result" id="res-bmi"></div>`,bmr:`<label>Weight kg</label><input id="bmr_w"><label>Height cm</label><input id="bmr_h"><label>Age</label><input id="bmr_age"><label>Gender</label><select id="bmr_g"><option value="">Select</option><option>Male</option><option>Female</option></select><style>#box-bmr input,#box-bmr select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcBMR()">Calculate</button><div class="result" id="res-bmr"></div>`,emi:`<label>Loan Amount</label><input id="emi_p"><label>Rate %</label><input id="emi_r"><label>Months</label><input id="emi_n"><style>#box-emi input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcEMI()">Calculate</button><div class="result" id="res-emi"></div>`,home:`<label>Home Price</label><input id="hl_p"><label>Down Payment</label><input id="hl_d"><label>Rate %</label><input id="hl_r"><label>Years</label><input id="hl_y"><style>#box-home input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcHL()">Calculate</button><div class="result" id="res-home"></div>`,personal:`<label>Loan Amount</label><input id="pl_p"><label>Rate %</label><input id="pl_r"><label>Months</label><input id="pl_n"><style>#box-personal input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcPL()">Calculate</button><div class="result" id="res-personal"></div>`,sip:`<label>Monthly</label><input id="sip_m"><label>Return %</label><input id="sip_r"><label>Years</label><input id="sip_y"><style>#box-sip input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcSIP()">Calculate</button><div class="result" id="res-sip"></div>`,fd:`<label>Principal</label><input id="fd_p"><label>Rate %</label><input id="fd_r"><label>Years</label><input id="fd_y"><style>#box-fd input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcFD()">Calculate</button><div class="result" id="res-fd"></div>`,ppf:`<label>Yearly</label><input id="ppf_y"><label>Rate %</label><input id="ppf_r"><label>Years</label><input id="ppf_t"><style>#box-ppf input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcPPF()">Calculate</button><div class="result" id="res-ppf"></div>`,rd:`<label>Monthly</label><input id="rd_m"><label>Rate %</label><input id="rd_r"><label>Months</label><input id="rd_n"><style>#box-rd input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcRD()">Calculate</button><div class="result" id="res-rd"></div>`,gst:`<label>Amount</label><input id="gst_a"><label>GST %</label><input id="gst_p"><label>Type</label><select id="gst_t"><option value="">Select</option><option value="add">Add</option><option value="remove">Remove</option></select><style>#box-gst input,#box-gst select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcGST()">Calculate</button><div class="result" id="res-gst"></div>`,vat:`<label>Amount</label><input id="vat_a"><label>VAT %</label><input id="vat_p"><style>#box-vat input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcVAT()">Calculate</button><div class="result" id="res-vat"></div>`,discount:`<label>Original</label><input id="dis_o"><label>Discount %</label><input id="dis_p"><style>#box-discount input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcDIS()">Calculate</button><div class="result" id="res-discount"></div>`,percentage:`<label>Value</label><input id="per_v"><label>%</label><input id="per_p"><style>#box-percentage input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcPER()">Calculate</button><div class="result" id="res-percentage"></div>`,fuel:`<label>Distance</label><input id="fuel_d"><label>Mileage</label><input id="fuel_m"><label>Price</label><input id="fuel_p"><style>#box-fuel input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcFUEL()">Calculate</button><div class="result" id="res-fuel"></div>`,time:`<label>Start</label><input type="date" id="td_s"><label>End</label><input type="date" id="td_e"><style>#box-time input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcTD()">Calculate</button><div class="result" id="res-time"></div>`,si:`<label>Principal</label><input id="si_p"><label>Rate</label><input id="si_r"><label>Years</label><input id="si_y"><style>#box-si input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcSI()">Calculate</button><div class="result" id="res-si"></div>`,ci:`<label>Principal</label><input id="ci_p"><label>Rate</label><input id="ci_r"><label>Years</label><input id="ci_y"><style>#box-ci input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcCI()">Calculate</button><div class="result" id="res-ci"></div>`,car:`<label>Price</label><input id="car_p"><label>Down</label><input id="car_d"><label>Rate</label><input id="car_r"><label>Years</label><input id="car_y"><style>#box-car input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcCAR()">Calculate</button><div class="result" id="res-car"></div>`,credit:`<label>Outstanding</label><input id="cc_a"><label>Rate %</label><input id="cc_r"><label>Months</label><input id="cc_m"><style>#box-credit input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcCC()">Calculate</button><div class="result" id="res-credit"></div>`,sales:`<label>Amount</label><input id="st_a"><label>Tax %</label><input id="st_p"><style>#box-sales input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcST()">Calculate</button><div class="result" id="res-sales"></div>`,income:`<label>Income</label><input id="it_a"><label>Slab %</label><input id="it_p"><label>Deduction</label><input id="it_d"><style>#box-income input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcIT()">Calculate</button><div class="result" id="res-income"></div>`,profit:`<label>Cost</label><input id="pm_c"><label>Selling</label><input id="pm_s"><style>#box-profit input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcPM()">Calculate</button><div class="result" id="res-profit"></div>`,inflation:`<label>Current</label><input id="inf_a"><label>Inflation %</label><input id="inf_r"><label>Years</label><input id="inf_y"><style>#box-inflation input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcINF()">Calculate</button><div class="result" id="res-inflation"></div>`,gratuity:`<label>Last Salary</label><input id="gr_s"><label>Years</label><input id="gr_y"><style>#box-gratuity input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}</style><button class="btn" onclick="calcGR()">Calculate</button><div class="result" id="res-gratuity"></div>`};
for(let k in simpleInputs){if(document.getElementById('box-'+k))document.getElementById('box-'+k).innerHTML=simpleInputs[k];}
function openTool(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+id).classList.add('active');}
function goHome(){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));}
function show(id,h){let e=document.getElementById(id);e.innerHTML=h;e.classList.add('show');}
function toDate(y,m,d){return new Date(y,m-1,d);}
function calcAge(){let bd=parseInt(document.getElementById('bd').value),bm=parseInt(document.getElementById('bm').value),by=parseInt(document.getElementById('by').value),td=parseInt(document.getElementById('td').value),tm=parseInt(document.getElementById('tm').value),ty=parseInt(document.getElementById('ty').value);if(!bd||!bm||!by||!td||!tm||!ty){show('res-age','Fill all');return;}let b=toDate(by,bm,bd),t=toDate(ty,tm,td),diff=Math.floor((t-b)/86400000);let tmths=(ty-by)*12+(tm-bm);if(td<bd)tmths--;let yrs=Math.floor(tmths/12),rm=tmths%12,temp=toDate(by+yrs,bm+rm,bd),rd=Math.floor((t-temp)/86400000);show('res-age',`<div class=r-row><span>Age</span><b>${yrs} Y ${rm} M ${rd} D</b></div><div class=r-row><span>Total Days</span><b>${diff}</b></div><div class=r-row><span>Weeks</span><b>${Math.floor(diff/7)}</b></div><div class=r-row><span>Hours</span><b>${diff*24}</b></div><div class=r-row><span>Minutes</span><b>${diff*24*60}</b></div><div class=r-row><span>Seconds</span><b>${diff*24*3600}</b></div>`);}
function calcBMI(){let w=parseFloat(document.getElementById('bmi_w').value),h=parseFloat(document.getElementById('bmi_h').value);if(!w||!h){show('res-bmi','Fill all');return;}let hm=h/100,bmi=w/(hm*hm);show('res-bmi',`<div class=r-row><span>BMI</span><b>${bmi.toFixed(2)}</b></div><div class=r-row><span>Status</span><b>${bmi<18.5?'Underweight':bmi<25?'Normal':bmi<30?'Overweight':'Obese'}</b></div><div class=r-row><span>Ideal Weight</span><b>${(18.5*hm*hm).toFixed(1)} to ${(24.9*hm*hm).toFixed(1)} kg</b></div>`);}
function calcBMR(){let w=parseFloat(document.getElementById('bmr_w').value),h=parseFloat(document.getElementById('bmr_h').value),a=parseFloat(document.getElementById('bmr_age').value),g=document.getElementById('bmr_g').value;if(!w||!h||!a||!g){show('res-bmr','Fill all');return;}let b=g==='Male'?88.362+13.397*w+4.799*h-5.677*a:447.593+9.247*w+3.098*h-4.33*a;show('res-bmr',`<div class=r-row><span>BMR</span><b>${b.toFixed(2)} cal/day</b></div><div class=r-row><span>Sedentary x1.2</span><b>${(b*1.2).toFixed(0)}</b></div><div class=r-row><span>Light x1.375</span><b>${(b*1.375).toFixed(0)}</b></div><div class=r-row><span>Moderate x1.55</span><b>${(b*1.55).toFixed(0)}</b></div><div class=r-row><span>Active x1.725</span><b>${(b*1.725).toFixed(0)}</b></div>`);}
function calcEMI(){let p=parseFloat(document.getElementById('emi_p').value),r=parseFloat(document.getElementById('emi_r').value),n=parseFloat(document.getElementById('emi_n').value);if(!p||!r||!n){show('res-emi','Fill all');return;}let mr=r/12/100,emi=p*mr*Math.pow(1+mr,n)/(Math.pow(1+mr,n)-1);show('res-emi',`<div class=r-row><span>EMI</span><b>${emi.toFixed(2)}</b></div><div class=r-row><span>Total</span><b>${(emi*n).toFixed(2)}</b></div><div class=r-row><span>Interest</span><b>${(emi*n-p).toFixed(2)}</b></div><div class=r-row><span>Interest %</span><b>${((emi*n-p)/p*100).toFixed(1)}%</b></div>`);}
function calcHL(){let pr=parseFloat(document.getElementById('hl_p').value),d=parseFloat(document.getElementById('hl_d').value),r=parseFloat(document.getElementById('hl_r').value),y=parseFloat(document.getElementById('hl_y').value);if(!pr||!d||!r||!y){show('res-home','Fill all');return;}let p=pr-d,n=y*12,mr=r/12/100,emi=p*mr*Math.pow(1+mr,n)/(Math.pow(1+mr,n)-1);show('res-home',`<div class=r-row><span>Loan</span><b>${p.toFixed(2)}</b></div><div class=r-row><span>EMI</span><b>${emi.toFixed(2)}</b></div><div class=r-row><span>Total Interest</span><b>${(emi*n-p).toFixed(2)}</b></div><div class=r-row><span>Total Payable</span><b>${(emi*n).toFixed(2)}</b></div>`);}
function calcPL(){let p=parseFloat(document.getElementById('pl_p').value),r=parseFloat(document.getElementById('pl_r').value),n=parseFloat(document.getElementById('pl_n').value);if(!p||!r||!n){show('res-personal','Fill all');return;}let mr=r/12/100,emi=p*mr*Math.pow(1+mr,n)/(Math.pow(1+mr,n)-1);show('res-personal',`<div class=r-row><span>EMI</span><b>${emi.toFixed(2)}</b></div><div class=r-row><span>Total Interest</span><b>${(emi*n-p).toFixed(2)}</b></div><div class=r-row><span>Total</span><b>${(emi*n).toFixed(2)}</b></div>`);}
function calcSIP(){let m=parseFloat(document.getElementById('sip_m').value),r=parseFloat(document.getElementById('sip_r').value),y=parseFloat(document.getElementById('sip_y').value);if(!m||!r||!y){show('res-sip','Fill all');return;}let n=y*12,mr=r/12/100,fv=m*((Math.pow(1+mr,n)-1)/mr)*(1+mr);show('res-sip',`<div class=r-row><span>Invested</span><b>${(m*n).toFixed(2)}</b></div><div class=r-row><span>Return</span><b>${(fv-m*n).toFixed(2)}</b></div><div class=r-row><span>Maturity</span><b>${fv.toFixed(2)}</b></div>`);}
function calcFD(){let p=parseFloat(document.getElementById('fd_p').value),r=parseFloat(document.getElementById('fd_r').value),y=parseFloat(document.getElementById('fd_y').value);if(!p||!r||!y){show('res-fd','Fill all');return;}let fv=p*Math.pow(1+r/100,y);show('res-fd',`<div class=r-row><span>Maturity</span><b>${fv.toFixed(2)}</b></div><div class=r-row><span>Interest</span><b>${(fv-p).toFixed(2)}</b></div>`);}
function calcPPF(){let y=parseFloat(document.getElementById('ppf_y').value),r=parseFloat(document.getElementById('ppf_r').value),t=parseFloat(document.getElementById('ppf_t').value);if(!y||!r||!t){show('res-ppf','Fill all');return;}let fv=y*(((Math.pow(1+r/100,t)-1)/(r/100));show('res-ppf',`<div class=r-row><span>Invested</span><b>${(y*t).toFixed(2)}</b></div><div class=r-row><span>Maturity</span><b>${fv.toFixed(2)}</b></div><div class=r-row><span>Gain</span><b>${(fv-y*t).toFixed(2)}</b></div>`);}
function calcRD(){let m=parseFloat(document.getElementById('rd_m').value),r=parseFloat(document.getElementById('rd_r').value),n=parseFloat(document.getElementById('rd_n').value);if(!m||!r||!n){show('res-rd','Fill all');return;}let mr=r/12/100,fv=m*((Math.pow(1+mr,n)-1)/mr)*(1+mr);show('res-rd',`<div class=r-row><span>Deposited</span><b>${(m*n).toFixed(2)}</b></div><div class=r-row><span>Maturity</span><b>${fv.toFixed(2)}</b></div>`);}
function calcGST(){let a=parseFloat(document.getElementById('gst_a').value),p=parseFloat(document.getElementById('gst_p').value),t=document.getElementById('gst_t').value;if(!a||!p||!t){show('res-gst','Fill all');return;}let gst,total;if(t==='add'){gst=a*p/100;total=a+gst;}else{gst=a-(a*100/(100+p));total=a-gst;}show('res-gst',`<div class=r-row><span>GST</span><b>${gst.toFixed(2)}</b></div><div class=r-row><span>Total</span><b>${total.toFixed(2)}</b></div>`);}
function calcVAT(){let a=parseFloat(document.getElementById('vat_a').value),p=parseFloat(document.getElementById('vat_p').value);if(!a||!p){show('res-vat','Fill all');return;}show('res-vat',`<div class=r-row><span>VAT</span><b>${(a*p/100).toFixed(2)}</b></div><div class=r-row><span>Total</span><b>${(a+a*p/100).toFixed(2)}</b></div>`);}
function calcDIS(){let o=parseFloat(document.getElementById('dis_o').value),p=parseFloat(document.getElementById('dis_p').value);if(!o||!p){show('res-discount','Fill all');return;}show('res-discount',`<div class=r-row><span>Discount</span><b>${(o*p/100).toFixed(2)}</b></div><div class=r-row><span>Final Price</span><b>${(o-o*p/100).toFixed(2)}</b></div>`);}
function calcPER(){let v=parseFloat(document.getElementById('per_v').value),p=parseFloat(document.getElementById('per_p').value);if(!v||!p){show('res-percentage','Fill all');return;}show('res-percentage',`<div class=r-row><span>${p}% of ${v}</span><b>${(v*p/100).toFixed(2)}</b></div>`);}
function calcFUEL(){let d=parseFloat(document.getElementById('fuel_d').value),m=parseFloat(document.getElementById('fuel_m').value),p=parseFloat(document.getElementById('fuel_p').value);if(!d||!m||!p){show('res-fuel','Fill all');return;}let f=d/m;show('res-fuel',`<div class=r-row><span>Fuel Needed</span><b>${f.toFixed(2)} L</b></div><div class=r-row><span>Cost</span><b>${(f*p).toFixed(2)}</b></div><div class=r-row><span>Cost/km</span><b>${(f*p/d).toFixed(2)}</b></div>`);}
function calcTD(){let s=document.getElementById('td_s').value,e=document.getElementById('td_e').value;if(!s||!e){show('res-time','Fill dates');return;}let diff=(new Date(e)-new Date(s))/86400000;show('res-time',`<div class=r-row><span>Days</span><b>${diff}</b></div><div class=r-row><span>Weeks</span><b>${(diff/7).toFixed(2)}</b></div><div class=r-row><span>Months</span><b>${(diff/30.44).toFixed(2)}</b></div><div class=r-row><span>Hours</span><b>${diff*24}</b></div>`);}
function calcSI(){let p=parseFloat(document.getElementById('si_p').value),r=parseFloat(document.getElementById('si_r').value),y=parseFloat(document.getElementById('si_y').value);if(!p||!r||!y){show('res-si','Fill all');return;}let si=p*r*y/100;show('res-si',`<div class=r-row><span>Interest</span><b>${si.toFixed(2)}</b></div><div class=r-row><span>Total</span><b>${(p+si).toFixed(2)}</b></div>`);}
function calcCI(){let p=parseFloat(document.getElementById('ci_p').value),r=parseFloat(document.getElementById('ci_r').value),y=parseFloat(document.getElementById('ci_y').value);if(!p||!r||!y){show('res-ci','Fill all');return;}let fv=p*Math.pow(1+r/100,y);show('res-ci',`<div class=r-row><span>Maturity</span><b>${fv.toFixed(2)}</b></div><div class=r-row><span>Interest</span><b>${(fv-p).toFixed(2)}</b></div>`);}
function calcCAR(){let pr=parseFloat(document.getElementById('car_p').value),d=parseFloat(document.getElementById('car_d').value)||0,r=parseFloat(document.getElementById('car_r').value),y=parseFloat(document.getElementById('car_y').value);if(!pr||!r||!y){show('res-car','Fill all');return;}let p=pr-d,n=y*12,mr=r/12/100,emi=p*mr*Math.pow(1+mr,n)/(Math.pow(1+mr,n)-1);show('res-car',`<div class=r-row><span>Loan</span><b>${p.toFixed(2)}</b></div><div class=r-row><span>EMI</span><b>${emi.toFixed(2)}</b></div><div class=r-row><span>Total Interest</span><b>${(emi*n-p).toFixed(2)}</b></div>`);}
function calcCC(){let a=parseFloat(document.getElementById('cc_a').value),r=parseFloat(document.getElementById('cc_r').value),m=parseFloat(document.getElementById('cc_m').value);if(!a||!r||!m){show('res-credit','Fill all');return;}let total=a*Math.pow(1+r/100,m);show('res-credit',`<div class=r-row><span>Total</span><b>${total.toFixed(2)}</b></div><div class=r-row><span>Interest</span><b>${(total-a).toFixed(2)}</b></div>`);}
function calcST(){let a=parseFloat(document.getElementById('st_a').value),p=parseFloat(document.getElementById('st_p').value);if(!a||!p){show('res-sales','Fill all');return;}show('res-sales',`<div class=r-row><span>Tax</span><b>${(a*p/100).toFixed(2)}</b></div><div class=r-row><span>Total</span><b>${(a+a*p/100).toFixed(2)}</b></div>`);}
function calcIT(){let a=parseFloat(document.getElementById('it_a').value),p=parseFloat(document.getElementById('it_p').value),d=parseFloat(document.getElementById('it_d').value)||0;if(!a||!p){show('res-income','Fill all');return;}let tax=(a-d)*p/100;show('res-income',`<div class=r-row><span>Taxable</span><b>${(a-d).toFixed(2)}</b></div><div class=r-row><span>Tax</span><b>${tax.toFixed(2)}</b></div><div class=r-row><span>Net After Tax</span><b>${(a-tax).toFixed(2)}</b></div>`);}
function calcPM(){let c=parseFloat(document.getElementById('pm_c').value),s=parseFloat(document.getElementById('pm_s').value);if(!c||!s){show('res-profit','Fill all');return;}let pr=s-c;show('res-profit',`<div class=r-row><span>Profit</span><b>${pr.toFixed(2)}</b></div><div class=r-row><span>Margin %</span><b>${(pr/s*100).toFixed(2)}%</b></div><div class=r-row><span>Markup %</span><b>${(pr/c*100).toFixed(2)}%</b></div>`);}
function calcINF(){let a=parseFloat(document.getElementById('inf_a').value),r=parseFloat(document.getElementById('inf_r').value),y=parseFloat(document.getElementById('inf_y').value);if(!a||!r||!y){show('res-inflation','Fill all');return;}let f=a*Math.pow(1+r/100,y);show('res-inflation',`<div class=r-row><span>Future Price</span><b>${f.toFixed(2)}</b></div><div class=r-row><span>Increase</span><b>${(f-a).toFixed(2)}</b></div>`);}
function calcGR(){let s=parseFloat(document.getElementById('gr_s').value),y=parseFloat(document.getElementById('gr_y').value);if(!s||!y){show('res-gratuity','Fill all');return;}let g=s*15/26*y;show('res-gratuity',`<div class=r-row><span>Gratuity</span><b>${g.toFixed(2)}</b></div><div class=r-row><span>Formula</span><b>Salary x 15/26 x Years</b></div>`);}
</script>
</body>
</html>
